# Global proxy configuration for Cluster demo
# multi-listener frontends
listeners:
  - ":8080"            # plaintext; HTTP/1.1 + h2c
  - ":8443 ssl quic"   # HTTPS + HTTP/3 on the same port (QUIC)

cache_dir: "/cache"
max_cache_size: "100MB"
max_cache_age: "1h"
max_write_workers: 4
max_response_body_size: "10MB"

# TLS certificates (auto-generated self-signed if not provided)
# tls_cert_file: "./certs/server.crt"
# tls_key_file: "./certs/server.key"

metrics_addr: ":9090"

json_log:
  enabled: true
  access_log: "/dev/stdout"
  error_log: "/dev/stderr"
  stdout: true

error_page:
  enabled: true
  statuses: [403, 404, 500, 502, 503, 504]

waf:
  enabled: true
  geolite_dir: "/usr/share/GeoIP"
  max_body_size: "1MB"

# Cluster Configuration
cluster:
  enabled: true            # enable cluster features
  nats_uri: "nats://nats:4222"  # external NATS JetStream holding target state
  lazy: true               # materialize target handlers on first request (CDN mode)
  data_dir: "/cache/targetstore"  # Pebble store directory
  lru_size: 1000           # compiled-handler LRU capacity
