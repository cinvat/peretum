server_name: "fallback"
host_header: ""
lb_algorithm: "round_robin"
upstreams:
  - url: "http://upstream-api-1:80"
    weight: 1
    health_check:
      path: "/health"
      interval: "10s"
      timeout: "3s"
      expected_status: 200
locations:
  - path: "/"
    match_type: "prefix"
    cache: false
    cors:
      enabled: true
      allow_origins: ["*"]
      allow_methods: ["GET", "POST", "OPTIONS"]
      allow_headers: ["*"]
      allow_credentials: true
    headers:
      request_add:
        X-Proxy: "peretum"
      response_add:
        X-Cache-Status: "disabled"
    proxy:
      pass_host_header: true
      websocket: true
      connect_timeout: "5s"
      read_timeout: "30s"
      send_timeout: "30s"