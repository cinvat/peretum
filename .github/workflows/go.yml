name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Run gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt failed on:"
            gofmt -l .
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test with race detector
        run: go test ./... -race -count=1
      - name: Check coverage (core packages)
        run: |
          # Exclude tools package (standalone h3 check tool) from coverage
          go test ./... -coverprofile=coverage.out
          # Check coverage for core packages (excluding tools)
          go tool cover -func=coverage.out | grep -v "tools/" | while read -r line; do
            pkg=$(echo "$line" | awk '{print $1}')
            cov=$(echo "$line" | awk '{print $3}' | sed 's/%//')
            if [ "$pkg" != "total:" ] && [ -n "$cov" ]; then
              if [ "$cov" != "100.0" ]; then
                echo "WARN: $pkg coverage $cov% < 100%"
              fi
            fi
          done
          # Check overall coverage is high
          total=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | sed 's/%//')
          if [ -n "$total" ] && [ "${total%.*}" -lt 95 ]; then
            echo "FAIL: Total coverage ${total}% < 95%"
            exit 1
          fi
          echo "Coverage check passed (total: ${total}%)"
