name: Go 🐹

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🦀 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: 🎨 Run gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt failed on:"
            gofmt -l .
            exit 1
          fi
      - name: 🔍 Run go vet
        run: go vet ./...
      - name: 📦 Build
        run: go build ./...
      - name: 🧪 Test with race detector
        run: go test ./... -race -count=1
      - name: 📊 Check coverage (core packages)
        run: |
          # Exclude tools package (standalone h3 check tool) and api/ packages from coverage
          go test ./... -coverprofile=coverage.out
          # Check coverage for core packages (excluding tools and api)
          go tool cover -func=coverage.out | grep -v "api/" | grep -v "tools/" | while read -r line; do
            pkg=$(echo "$line" | awk '{print $1}')
            cov=$(echo "$line" | awk '{print $3}' | sed 's/%//')
            if [ "$pkg" != "total:" ] && [ -n "$cov" ]; then
              if [ "$cov" != "100.0" ]; then
                echo "WARN: $pkg coverage $cov% < 100%"
              fi
            fi
          done
          # Compute total coverage from filtered lines
          total=$(go tool cover -func=coverage.out | grep -v "api/" | grep -v "tools/" | grep "^total:" | awk '{print $3}' | sed 's/%//')
          if [ -n "$total" ] && [ "${total%.*}" -lt 91 ]; then
            echo "❌ FAIL: Total coverage ${total}% < 91%"
            exit 1
          fi
          echo "✅ Coverage check passed (total: ${total}%)"
      - name: 🛠️ Generate coverage badge
        run: |
          total=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | sed 's/%//')
          if [ -n "$total" ]; then
            label="coverage"
            # Generate Shields.io badge URL
            badge_url="https://img.shields.io/badge/${label}-${total}%25-brightgreen"
            echo "badge_url=$badge_url" >> $GITHUB_ENV
          fi
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🦀 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: 🔧 Install golangci-lint
        uses: golangci/golangci-lint-action@v3
      - name: 🕵️ Run golangci-lint
        run: golangci-lint run ./...
