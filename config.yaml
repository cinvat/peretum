# Frontend listeners. When `listeners` is set it takes over
# from `listen`; otherwise the legacy `listen` shorthand is used (TLS is
# implied by configured certs, HTTP/3 on the listen port).
# Flags per entry: ssl, h2c, h2/http2, h3/http3/quic (h3 implies ssl).
# `listen: ":8081"` above is ignored while the list below is active.
listeners:
  - ":80"
  - ":443 ssl h2 h3"
# If you prefer the single-address form, comment out `listeners` and use:
# listen: ":8081"
# http3_addr: ":8443"          # HTTP/3 (QUIC/UDP) frontend; required for TLS
#                            # certs to be configured below or per-target.
#                            # When TLS is active and http3_addr is unset,
#                            # HTTP/3 is served by default on the listen port.
#                            # A self-signed certificate is generated whenever
#                            # TLS/HTTP/3 is requested but no cert is valid.
cache_dir: "./cache"
max_cache_size: "500MB"
max_cache_age: "24h"
# max_write_workers: 8        # max concurrent cache writes; -1 = unlimited (default 8)
# max_response_body_size: "50MB"  # max buffered response body; -1 = unlimited (default 50MB)
metrics_addr: ":9090"

json_log:
  enabled: true
  access_log: "./logs/access.jsonl"
  error_log: "./logs/error.jsonl"
  stdout: true

plugins:
  cors:
    enabled: true
  headers:
    enabled: true
  rewrite:
    enabled: true
  compression:
    enabled: true
  optimizer:
    enabled: true
  prometheus_exporter:
    enabled: true
    listen: ":9090"

error_page:
  enabled: true

waf:
  enabled: false
  # GeoLite databases are general: one shared directory for every location.
  # http://geolite.maxmind.com/download/geoip/database/GeoLite2-Country.tar.gz
  # http://geolite.maxmind.com/download/geoip/database/GeoLite2-ASN.tar.gz
  # http://geolite.maxmind.com/download/geoip/database/GeoLite2-City.tar.gz
  geolite_dir: "./plugins/waf/geolite"
